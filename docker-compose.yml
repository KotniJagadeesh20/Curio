services:
  db:
    image: postgres:16
    container_name: codemastery-db
    environment:
      POSTGRES_DB: codemastery
      POSTGRES_USER: codemastery
      POSTGRES_PASSWORD: codemastery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # S3-compatible object storage for Step 12c (dev and integration tests only; credentials below are throwaway).
  # The official minio/minio images are no longer published (Docker Hub repo removed, quay.io refuses pulls, dl.min.io returns 410), so no
  # image is hard-coded here: set MINIO_IMAGE to a MinIO build you have vetted (and pin it by tag or digest).
  #   MINIO_IMAGE=<image> docker compose up -d minio
  minio:
    image: ${MINIO_IMAGE:-set-MINIO_IMAGE-to-a-vetted-minio-image}   # placeholder on purpose: a required-variable check would also break `up db`
    container_name: codemastery-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
